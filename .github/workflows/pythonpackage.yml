name: Python tests

on:
  push:
    paths:
      - 'gixy/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.py'
      - 'requirements*.txt'
      - 'setup.cfg'
      - 'pyproject.toml'
      - '.github/workflows/pythonpackage.yml'
  pull_request:
    paths:
      - 'gixy/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.py'
      - 'requirements*.txt'
      - 'setup.cfg'
      - 'pyproject.toml'
      - '.github/workflows/pythonpackage.yml'

jobs:
  # Check plugin help_url values and documentation
  plugin-checks:
    name: Plugin validation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check plugin help_url values
        run: python scripts/check_plugin_help_urls.py
      - name: Check plugin documentation
        run: python scripts/check_plugin_docs.py

  # Verify scripts work on Python 3.6 (minimum supported version)
  py36-compat:
    name: Python 3.6 compatibility check
    runs-on: ubuntu-22.04
    container:
      image: python:3.6-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install flake8
        run: 'python -m pip install --only-binary=:all: flake8==5.0.4'
      - name: Check for Python 3.6 syntax compatibility
        run: |
          # Check for syntax errors and undefined names (F821)
          flake8 scripts/ gixy/ --count --select=E9,F63,F7,F82,F821 --show-source --statistics
      - name: Verify scripts run on Python 3.6
        run: |
          python scripts/check_plugin_help_urls.py
          python scripts/check_plugin_docs.py

  legacy:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.6', '3.7']
    container:
      image: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies & test
        run: |
          python -m pip install --only-binary=:all: \
            'ngxparse==0.5.16' \
            'cached-property==1.5.2; python_version < "3.8"' \
            'cached-property==2.0.1; python_version >= "3.8"' \
            'argparse==1.4.0' \
            'Jinja2==3.0.3; python_version == "3.6"' \
            'Jinja2==3.1.6; python_version >= "3.7"' \
            'ConfigArgParse==1.7.5' \
            'pytest==7.0.1; python_version == "3.6"' \
            'pytest==7.4.4; python_version == "3.7"' \
            'pytest==8.3.5; python_version >= "3.8"' \
            'pytest-xdist==3.0.2; python_version == "3.6"' \
            'pytest-xdist==3.5.0; python_version == "3.7"' \
            'pytest-xdist==3.6.1; python_version >= "3.8"' \
            'flake8==5.0.4; python_version < "3.8"' \
            'flake8==7.1.2; python_version >= "3.8"'
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest -v -n auto
  modern:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --only-binary=:all: \
          'ngxparse==0.5.16' \
          'cached-property==1.5.2; python_version < "3.8"' \
          'cached-property==2.0.1; python_version >= "3.8"' \
          'argparse==1.4.0' \
          'Jinja2==3.0.3; python_version == "3.6"' \
          'Jinja2==3.1.6; python_version >= "3.7"' \
          'ConfigArgParse==1.7.5' \
          'pytest==7.0.1; python_version == "3.6"' \
          'pytest==7.4.4; python_version == "3.7"' \
          'pytest==8.3.5; python_version >= "3.8"' \
          'pytest-xdist==3.0.2; python_version == "3.6"' \
          'pytest-xdist==3.5.0; python_version == "3.7"' \
          'pytest-xdist==3.6.1; python_version >= "3.8"' \
          'flake8==5.0.4; python_version < "3.8"' \
          'flake8==7.1.2; python_version >= "3.8"'
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest -v -n auto
      env:
        GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
